name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: visualstarlog
      - name: Check out the Lucian Office core beside Visual Starlog, as in lucianos/apps
        uses: actions/checkout@v4
        with:
          repository: luciangreen/lucianoffice
          ref: main
          path: lucianoffice
      - name: Check out Starlog (the syntax presentations are written in)
        uses: actions/checkout@v4
        with:
          repository: luciangreen/Starlog
          path: Starlog
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install SWI-Prolog
        run: |
          sudo apt-add-repository --yes ppa:swi-prolog/stable
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox
      - name: Unit tests
        working-directory: visualstarlog
        run: npm test
      - name: The Starlog examples run
        working-directory: visualstarlog
        env:
          STARLOG_DIR: ${{ github.workspace }}/Starlog
        run: npm run check-examples
